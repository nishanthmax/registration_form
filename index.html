<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registration Form</title>
</head>
<body>
    <div class="container">
        <div class="branding">
            <img src="https://image2url.com/r2/default/images/1770038733791-77172792-f6ba-4fc8-9acd-bfc06e836ea2.png" alt="Vibe Zone Logo" class="logo-top">
            <p class="quote">YOUNG INDIANS YUVA CLUB OF JEPPIAAR ENGINEERING COLLEGE</p>
            <p class="present">present</p>
            <img src="https://image2url.com/r2/default/images/1770038846167-8e012742-0b6a-46a1-a3e7-3815c2f2d181.png" alt="Event Logo" class="logo-event">
        </div>
        <h1>Welcome to Vibe Zone</h1>
        <div id="message" class="message"></div>
        <form id="registrationForm" action="https://formspree.io/f/mbdkpjpb" method="POST">
            <label for="fullName">Name:</label>
            <input type="text" id="fullName" name="name" required>

            <label for="department">Department:</label>
            <input type="text" id="department" name="department" required>

            <label for="year">Year:</label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email" required>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>

            <label for="application">Select Application:</label>
            <select id="application" name="application" required>
                <option value="">Select Application</option>
                <option value="Google Drive">Google Drive</option>
                <option value="Google Docs">Google Docs</option>
                <option value="Google Sheets">Google Sheets</option>
                <option value="Google Slides">Google Slides</option>
                <option value="Google Calendar">Google Calendar</option>
                <option value="Gmail">Gmail</option>
                <option value="Google Meet">Google Meet</option>
                <option value="Notion">Notion</option>
                <option value="Microsoft OneNote">Microsoft OneNote</option>
                <option value="Trello">Trello</option>
                <option value="Todoist">Todoist</option>
                <option value="Clockify">Clockify</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="LinkedIn Learning">LinkedIn Learning</option>
                <option value="Coursera">Coursera</option>
                <option value="Udemy">Udemy</option>
                <option value="Khan Academy">Khan Academy</option>
                <option value="GitHub">GitHub</option>
                <option value="GitHub Desktop">GitHub Desktop</option>
                <option value="Visual Studio Code">Visual Studio Code</option>
                <option value="ChatGPT">ChatGPT</option>
                <option value="Replit">Replit</option>
                <option value="Canva">Canva</option>
                <option value="Figma">Figma</option>
                <option value="Adobe Express">Adobe Express</option>
                <option value="Indeed">Indeed</option>
                <option value="Naukri">Naukri</option>
                <option value="Internshala">Internshala</option>
                <option value="Glassdoor">Glassdoor</option>
                <option value="Google Forms">Google Forms</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Instagram">Instagram</option>
                <option value="YouTube">YouTube</option>
                <option value="Telegram">Telegram</option>
                <option value="X (Twitter)">X (Twitter)</option>
            </select>

            <input type="hidden" name="_subject" value="New Vibe Zone Registration">

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </div>
    <script>
        // Track app selections
        const appCounts = JSON.parse(localStorage.getItem('appCounts')) || {};
        const applications = [
            'Google Drive',
            'Google Docs',
            'Google Sheets',
            'Google Slides',
            'Google Calendar',
            'Gmail',
            'Google Meet',
            'Notion',
            'Microsoft OneNote',
            'Trello',
            'Todoist',
            'Clockify',
            'LinkedIn',
            'LinkedIn Learning',
            'Coursera',
            'Udemy',
            'Khan Academy',
            'GitHub',
            'GitHub Desktop',
            'Visual Studio Code',
            'ChatGPT',
            'Replit',
            'Canva',
            'Figma',
            'Adobe Express',
            'Indeed',
            'Naukri',
            'Internshala',
            'Glassdoor',
            'Google Forms',
            'WhatsApp',
            'Instagram',
            'YouTube',
            'Telegram',
            'X (Twitter)'
        ];

        const appSelect = document.getElementById('application');
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');

        // Initialize app counts
        applications.forEach(app => {
            if (!appCounts[app]) appCounts[app] = 0;
        });

        // Update dropdown options to show count and disable full apps
        function updateAppOptions() {
            appSelect.innerHTML = '<option value="">Select Application</option>';
            applications.forEach(app => {
                const count = appCounts[app] || 0;
                const option = document.createElement('option');
                option.value = app;
                option.textContent = `${app} (${count}/2 registered)`;
                
                if (count >= 2) {
                    option.disabled = true;
                    option.textContent += ' - FULL';
                }
                appSelect.appendChild(option);
            });
        }

        // Update on load
        updateAppOptions();

        // Handle form submission
        form.addEventListener('submit', function(e) {
            const selectedApp = appSelect.value;
            
            if (appCounts[selectedApp] >= 2) {
                e.preventDefault();
                alert('❌ This app is FULL. Maximum 2 participants reached. Please select another app.');
                return false;
            }

            // Increment count after successful submission
            appCounts[selectedApp] = (appCounts[selectedApp] || 0) + 1;
            localStorage.setItem('appCounts', JSON.stringify(appCounts));

            // Show success and update options
            setTimeout(() => {
                updateAppOptions();
                alert('✅ Registration submitted!');
            }, 500);
        });
    </script>

    <!-- Formspree handles submission; no JS required -->
</body>
</html>
