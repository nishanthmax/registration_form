<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Panel - Vibe Zone</title>
</head>
<body>
    <div class="admin-container">
        <h1>🔐 Admin Control Panel</h1>

        <!-- Login Form -->
        <div id="loginForm" class="login-form active">
            <div class="form-group">
                <label for="adminPassword">Admin Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <button type="button" id="loginBtn" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
            <div id="loginError" style="color: #dc3545; margin-top: 10px; text-align: center;"></div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel">
            <div class="admin-info">
                <p><strong>Status:</strong> <span id="currentStatus">Loading...</span></p>
                <p><strong>Last Updated:</strong> <span id="lastUpdated">-</span></p>
            </div>

            <div style="text-align: center;">
                <label style="font-size: 16px; font-weight: bold;">Registration Access:</label>
                <div class="toggle-container">
                    <span>OFF</span>
                    <div id="toggleSwitch" class="toggle-switch">
                        <div class="toggle-slider"></div>
                    </div>
                    <span>ON</span>
                </div>
            </div>

            <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
